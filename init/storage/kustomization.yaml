apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply order matters here: Namespace must exist before PVCs that reference it.
# Kustomize doesn't guarantee order, but kubectl apply -k (and ArgoCD) handle
# this via the standard apply ordering built into Kubernetes — Namespaces are
# created before namespaced resources automatically.
resources:
  - namespace.yaml
  - persistent-volumes.yaml
  - persistent-volume-claims.yaml
