# =============================================================================
# INGRESSCLASS
# =============================================================================
# An IngressClass tells Kubernetes which controller should handle a given
# Ingress resource. Before IngressClass (pre-1.18), you used the annotation:
#   kubernetes.io/ingress.class: "haproxy"
# Now you set spec.ingressClassName on the Ingress object instead.
#
# WHY THIS MATTERS:
#   If you ever add a second ingress controller (e.g., Nginx for some apps),
#   each Ingress resource declares which controller owns it via ingressClassName.
#   Without this, both controllers would try to handle every Ingress.
#
# is-default-class annotation:
#   Makes HAProxy the default — Ingress objects that don't specify an
#   ingressClassName will be picked up by HAProxy automatically.
#   Remove this annotation if you want to be explicit on every Ingress.
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: haproxy
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  # Points to the HAProxy Ingress controller.
  # This value matches what the controller registers when it starts.
  controller: haproxy.org/ingress-controller
