apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Pull the upstream ArgoCD install manifest
  - namespace.yaml
  - ingress.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

namespace: argocd

patches:
  # Pin every ArgoCD deployment/statefulset to the 'case' node.
  # Case is tainted function=centralcommand:PreferNoSchedule, so we also
  # add a matching toleration so pods are preferred here, and a nodeSelector
  # to hard-target it when other nodes exist.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: Deployment
      name: argocd-server

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: Deployment
      name: argocd-repo-server

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: Deployment
      name: argocd-applicationset-controller

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: Deployment
      name: argocd-notifications-controller

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: Deployment
      name: argocd-dex-server

  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: StatefulSet
      name: argocd-application-controller

  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-redis
        namespace: argocd
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: case
            tolerations:
              - key: function
                operator: Equal
                value: centralcommand
                effect: PreferNoSchedule
    target:
      kind: StatefulSet
      name: argocd-redis

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        namespace: argocd
      data:
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "Ingress is healthy"
          return hs
    target:
      kind: ConfigMap
      name: argocd-cm

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
        namespace: argocd
      data:
        server.insecure: "true"
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
