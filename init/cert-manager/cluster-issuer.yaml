# =============================================================================
# CLUSTERISSUER — Let's Encrypt via Cloudflare DNS-01
# =============================================================================
# ClusterIssuer is cluster-scoped — any namespace can request certs from it.
#
# cnameStrategy: Follow fixes the empty zone ID bug where cert-manager calls
# DELETE /zones//dns_records/... during TXT record cleanup. It tells cert-manager
# to follow CNAME chains when resolving which Cloudflare zone owns the domain.
# =============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: iiamrbcdev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
