apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media            # Shared media namespace (same as the PVCs)
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  # Recreate: kill the old pod before starting the new one.
  # Required because qbittorrent holds an exclusive lock on its config directory.
  # A RollingUpdate would try to start the new pod while the old one still has
  # the config mounted, causing the new pod to fail or corrupt state.
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: tars

      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: "America/New_York"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1002"
            - name: WEBUI_PORT
              value: "8080"

          ports:
            - name: webui
              containerPort: 8080
              protocol: TCP
            - name: bittorrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 6881
              protocol: UDP

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

          volumeMounts:
            # Config: scoped to /data/config/qbittorrent via subPath.
            # The 'config' PVC covers all of /data/config — subPath ensures
            # this container only sees its own directory, not other apps'.
            - name: config
              mountPath: /config
              subPath: qbittorrent

            # Media root: full /data/media tree, no subPath.
            # qbittorrent needs the whole tree so downloaded files land in the
            # right place for Sonarr/Radarr to hardlink from.
            - name: media
              mountPath: /downloads
              subPath: videos/movies
            
            - name: media
              mountPath: /downloadstv
              subPath: videos/tv

          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 15
            periodSeconds: 15

      volumes:
        # 'config' PVC covers all of /data/config on tars.
        # subPath in the volumeMount above scopes each app to its own directory.
        - name: config
          persistentVolumeClaim:
            claimName: config

        # 'media' PVC covers all of /data/media on tars.
        # subPath in the volumeMount scopes each app to its relevant subtree.
        - name: media
          persistentVolumeClaim:
            claimName: media
